<style>
:root{
  --g:#1F5C4A; --g2:#2E7D5B; --gl:#E8F1EC; --ink:#1d2421; --mut:#5d6b65; --line:#d9e2dd;
  --bg:#f6f8f7; --card:#ffffff; --in:#fffbea; --inb:#e2c766; --red:#b00020; --redl:#fde7ea;
  --amb:#8a5a00; --ambl:#fff3d6; --ok:#1b5e20; --okl:#e3f2e5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--g);color:#fff;padding:14px 16px 0}
header .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
.brand{display:flex;align-items:center;gap:12px}.brand svg{width:52px;height:52px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.bn{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#E2B93B}
body.locked nav{display:none}
.lockcard svg{width:84px;height:84px;margin-bottom:6px}
.receipt .rl{display:flex;justify-content:center;margin-bottom:4px}.receipt .rl svg{width:42px;height:42px}
.leaders{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.leader{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.leader .c{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.leader .n{font-size:16px;font-weight:700;color:var(--g);margin:2px 0}
.printsig{display:none}.printonly{display:none}
@media print{.printonly{display:block!important}textarea.noprint{display:none!important}.printsig{display:flex;justify-content:space-between;gap:20px;margin-top:40px;font-size:12px}}
header .sub{opacity:.85;font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1200px;margin:10px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:#dcebe4;border:0;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--g);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px;color:var(--g)}
h3{font-size:15px;margin:0 0 10px;color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;color:var(--g);font-variant-numeric:tabular-nums}
.kpi.warn .v{color:var(--red)}
.two{grid-template-columns:1fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
label.full{grid-column:1/-1}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--inb);background:var(--in);border-radius:8px;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--g2);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn:hover{background:var(--g2)}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn.dan{background:var(--red)}
.btn.ghost{background:transparent;color:var(--g);padding:5px 8px}
.btn.ghost.dan{color:var(--red);background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.info{font-size:13px;color:var(--mut);background:var(--gl);border-radius:8px;padding:8px 10px}
.pickname{font-size:13px;color:var(--g);font-weight:600;min-height:18px}
.acts{white-space:nowrap}.acts .btn{margin-right:4px}
.btn.del{background:#fff;color:var(--red);border:1px solid var(--red)}.btn.del:hover{background:var(--redl)}
.lengo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;grid-column:1/-1;background:var(--gl);padding:10px;border-radius:10px}
@media (max-width:520px){.lengo-wrap{grid-template-columns:1fr}}
.calc{background:var(--gl);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.calc div span{display:block;font-size:12px;color:var(--mut)}
.calc div b{font-size:17px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--g);color:#fff;text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--gl);border-top:2px solid var(--g)}
tbody tr:hover{background:#fafcfb}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.chip.ok{background:var(--okl);color:var(--ok)}
.chip.bad{background:var(--redl);color:var(--red)}
.chip.hai{background:var(--ambl);color:var(--amb)}
.stmt td:first-child{color:var(--mut)}
.stmt td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.stmt tr.sec td{background:var(--g);color:#fff;font-weight:600}
.stmt tr.big td{font-size:17px;font-weight:700;background:var(--gl)}
.stmt input{max-width:160px;text-align:right}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.alert.bad{background:var(--redl);color:var(--red)}
.alert.ok{background:var(--okl);color:var(--ok)}
.alert.amb{background:var(--ambl);color:var(--amb)}
.muted{color:var(--mut);font-size:13px}
.empty{padding:22px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:14px;padding:0;max-width:720px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,30,22,.45)}
dialog .dh{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
dialog .dh b{font-size:16px}
dialog .dh button{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
dialog .db{padding:16px;max-height:75vh;overflow:auto}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90%}
#toast.on{opacity:1}
.receipt{max-width:380px;margin:0 auto;font-size:14px}
.receipt h4{text-align:center;margin:0;font-size:17px;color:var(--g)}
.receipt .t{text-align:center;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:4px 0 10px}
.receipt table td{border-top:1px dashed var(--line)}
.sig{margin-top:26px;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
@media print{
  header,nav,.noprint,#toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  body.pm main{display:none}
  body.pm dialog{position:static;box-shadow:none;max-width:none;width:auto}
  body.pm dialog .dh,body.pm dialog .df{display:none}
  body.pm dialog .db{max-height:none;overflow:visible}
  th{background:#ddd!important;color:#000!important}
  .tw{overflow:visible!important;border:0}
  table{font-size:11px}
  td,th{padding:4px 6px;white-space:normal}
  th{position:static}
  tr,.kpi,.stmt tr{page-break-inside:avoid;break-inside:avoid}
  h3{page-break-after:avoid;break-after:avoid}
  .kpis{grid-template-columns:repeat(4,1fr)!important;gap:6px}
  .kpi{padding:6px 8px}.kpi .v{font-size:15px}
  .pdfhead{display:flex!important}
  html,body{background:#fff!important}
}
@page{size:A4;margin:12mm}
.pdfhead{display:none;align-items:center;gap:12px;border-bottom:2px solid var(--g);padding-bottom:8px;margin-bottom:12px}
.pdfhead svg{width:46px;height:46px}
.pdfhead .t{font-size:17px;font-weight:700;color:var(--g)}
.pdfhead .m{font-size:11px;color:var(--mut)}
.btn.pdf{background:#B3261E}.btn.pdf:hover{background:#8C1D18}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><svg aria-hidden="true" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#1F5C4A"/><circle cx="32" cy="32" r="28.5" fill="none" stroke="#E2B93B" stroke-width="1.6"/><g fill="#fff" stroke="#1F5C4A" stroke-width="1.6"><circle cx="17" cy="24.5" r="4.6"/><path d="M8.5 45 Q8.5 31 17 31 Q25.5 31 25.5 45Z"/><circle cx="47" cy="24.5" r="4.6"/><path d="M38.5 45 Q38.5 31 47 31 Q55.5 31 55.5 45Z"/><circle cx="32" cy="18.5" r="5.4"/><path d="M22 46 Q22 26 32 26 Q42 26 42 46Z"/></g><path d="M13 38 Q32 30 51 38" fill="none" stroke="#E2B93B" stroke-width="2.6" stroke-linecap="round"/><path d="M12 48.5 Q32 56 52 48.5" fill="none" stroke="#E2B93B" stroke-width="3" stroke-linecap="round"/></svg><div><div class="bn">VICOBA SYSTEM</div><h1 id="hJina">Kikundi</h1><div class="sub" id="hSub"></div></div></div>
    <div style="text-align:right"><button class="btn sm" id="hInstall" data-a="installApp" style="display:none;background:#E2B93B;color:#1F5C4A;margin-bottom:6px">&#11015; Sakinisha App</button><div class="sub" id="hSave"></div></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<dialog id="dlg"><div class="dh"><b id="dlgT"></b><button data-a="closeDlg" aria-label="Funga">&times;</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="xlsKikao" accept=".xlsx,.csv" hidden>
<input type="file" id="xlsIn" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>

<datalist id="dlLengo"></datalist>

<script>
"use strict";
const APP_VERSION="2.0 (12/11/2026)";
const LOGO=`<svg aria-hidden="true" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#1F5C4A"/><circle cx="32" cy="32" r="28.5" fill="none" stroke="#E2B93B" stroke-width="1.6"/><g fill="#fff" stroke="#1F5C4A" stroke-width="1.6"><circle cx="17" cy="24.5" r="4.6"/><path d="M8.5 45 Q8.5 31 17 31 Q25.5 31 25.5 45Z"/><circle cx="47" cy="24.5" r="4.6"/><path d="M38.5 45 Q38.5 31 47 31 Q55.5 31 55.5 45Z"/><circle cx="32" cy="18.5" r="5.4"/><path d="M22 46 Q22 26 32 26 Q42 26 42 46Z"/></g><path d="M13 38 Q32 30 51 38" fill="none" stroke="#E2B93B" stroke-width="2.6" stroke-linecap="round"/><path d="M12 48.5 Q32 56 52 48.5" fill="none" stroke="#E2B93B" stroke-width="3" stroke-linecap="round"/></svg>`;
const CHEO=["Mwenyekiti","Makamu Mwenyekiti","Katibu","Katibu Msaidizi","Mweka Hazina"];
/* ================================================================ DATA */
const KEY = "mfumo_kikundi_v1";
const AINA = ["Hisa","Jamii","Marejesho ya Mkopo","Riba ya Mkopo","Adhabu ya Mkopo","Adhabu Nyingine","Ada ya Kujiunga","Mchango Mwingine"];
const LENGO_DEF = ["T-shirt","Rambirambi","Harusi","Uzazi","Ugonjwa","Sherehe","Safari"];
const LOAN_TYPES = ["Marejesho ya Mkopo","Riba ya Mkopo","Adhabu ya Mkopo"];
const KUNDI = ["Uendeshaji wa Ofisi","Shajara na Vifaa","Usafiri","Posho za Vikao","Ada za Benki na Simu","Gharama za Mradi","Mengineyo","Msaada wa Jamii","Matumizi ya Michango Maalum"];
const KUNDI_FAIDA = KUNDI.filter(k=>k!=="Msaada wa Jamii"&&k!=="Matumizi ya Michango Maalum");
const HALI = ["Hai","Amesimamishwa","Amejitoa"];

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function blank(){
  const y=new Date().getFullYear();
  return {v:1,settings:{jina:"KIKUNDI CHETU",anza:y+"-01-01",mwisho:y+"-12-31",beiHisa:5000,riba:10,ainaRiba:"Flat",kikomo:3,
    adhabuPct:5,rudishaJamii:"NDIYO",kataDeni:"HAPANA",salioKuanzia:0,mapatoMengineyo:0,adaKujiunga:0,akibaPct:10,kiasiKilichoamuliwa:"",uchakavu:0},
    usalama:{hash:"",salt:"",fungaWote:false,adminHash:"",adminSalt:""},vikao:[],
    wanachama:[],michango:[],mikopo:[],miradi:[],mapato:[],matumizi:[],historia:[],uongozi:[],kumbukumbu:[],imehifadhiwa:null};
}
let D = blank();
let storageOk = true;
function load(){
  try{const s=localStorage.getItem(KEY); if(s){D=normalize(JSON.parse(s))}}
  catch(e){storageOk=false}
}
function normalize(o){const b=blank(),x=Object.assign(b,o);x.settings=Object.assign(blank().settings,o.settings||{});x.usalama=Object.assign(blank().usalama,o.usalama||{});return x}
function save(){
  D.imehifadhiwa=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(D)); storageOk=true}catch(e){storageOk=false}
  renderHeader();
}

/* ================================================================ HELPERS */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/,/g,""));return isFinite(n)?n:0};
const fm=n=>Math.round(num(n)).toLocaleString("en-US");
const fd=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function toISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addMonths(iso,n){const d=parseISO(iso);const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return toISO(t)}
function monthsBetween(a,b){const x=parseISO(a),y=parseISO(b);if(y<x)return 0;let m=(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth());if(y.getDate()<x.getDate())m--;return Math.max(0,m)}
function nextCode(list,prefix,digits){let mx=0;for(const r of list){const s=String(r.id||"");if(s.startsWith(prefix)){const n=parseInt(s.slice(prefix.length),10);if(n>mx)mx=n}}return prefix+String(mx+1).padStart(digits,"0")}
function nextReceipt(){let mx=0;for(const r of D.michango){const n=parseInt(String(r.risiti).slice(3),10);if(n>mx)mx=n}return "RS-"+String(mx+1).padStart(5,"0")}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}
function fullName(m){return [m.j1,m.j2,m.j3].filter(Boolean).join(" ")}
function member(id){return D.wanachama.find(m=>m.id===id)}
function memberLabel(id){const m=member(id);return m?m.id+" - "+fullName(m):id}
function round(n){return Math.round(n)}
/* member lookup by the group's own member number */
function resolveMember(t){
  t=String(t??"").trim();if(!t)return null;
  const p=t.indexOf(" - ");if(p>0)t=t.slice(0,p).trim();
  const u=t.toUpperCase();
  let m=D.wanachama.find(x=>String(x.id).toUpperCase()===u);
  if(!m&&/^\d+$/.test(t))m=D.wanachama.find(x=>/^\d+$/.test(x.id)&&Number(x.id)===Number(t));
  return m||null;
}
function picker(name,value,label,opt){
  const m=value?member(value):null;
  return `<label class="${opt&&opt.full?"full":""}">${label}<input name="${name}" list="dlMw" autocomplete="off" inputmode="text" data-picker placeholder="Andika namba ya mwanachama" value="${esc(m?m.id:value||"")}"><span class="pickname">${m?esc(fullName(m)):""}</span></label>`;
}
function lengoList(){const set=new Set(LENGO_DEF);for(const r of D.michango)if(r.lengo)set.add(r.lengo);for(const r of D.matumizi)if(r.lengo)set.add(r.lengo);return [...set]}
function refreshDatalist(){const dl=$("#dlMw");if(dl)dl.innerHTML=D.wanachama.map(m=>`<option value="${esc(m.id)}">${esc(fullName(m))}</option>`).join("");
  const ll=$("#dlLengo");if(ll)ll.innerHTML=lengoList().map(x=>`<option value="${esc(x)}"></option>`).join("")}
function ainaTxt(r){return r.aina+(r.lengo?" ("+r.lengo+")":"")}
function acts(btns){return `<td class="acts noprint">${btns.join("")}</td>`}
function bEdit(a,id){return `<button class="btn sm sec" data-a="${a}" data-id="${esc(id)}">&#9998; Hariri</button>`}
function bDel(a,id){return `<button class="btn sm del" data-a="${a}" data-id="${esc(id)}">&#128465; Futa</button>`}
function suggestNumber(){
  const ids=D.wanachama.map(m=>m.id);
  if(!ids.length)return "001";
  const nums=ids.filter(i=>/^\d+$/.test(i));
  if(nums.length===ids.length){const w=Math.max(...nums.map(n=>n.length));return String(Math.max(...nums.map(Number))+1).padStart(w,"0")}
  const last=ids[ids.length-1],mm=last.match(/^(.*?)(\d+)$/);
  return mm?mm[1]+String(Number(mm[2])+1).padStart(mm[2].length,"0"):"";
}
function guarantorText(l){return [l.mdhamini1,l.mdhamini2].filter(Boolean).map(g=>{const m=member(g);return m?m.id+" "+fullName(m):g}).join(", ")}
async function hashPw(pw,salt){
  const s=salt+"|"+pw;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "f"+h.toString(16)}
}

/* ================================================================ CALCULATIONS */
function sumM(f){let s=0;for(const r of D.michango)if(f(r))s+=num(r.kiasi);return s}
function loanInterest(P,r,n,aina){
  if(aina==="Inayopungua"){if(r===0)return 0;const i=r/100;const pmt=P*i/(1-Math.pow(1+i,-n));return round(pmt*n-P)}
  return round(P*r/100*n);
}
function pmtOf(P,r,n){if(r===0)return P/n;const i=r/100;return P*i/(1-Math.pow(1+i,-n))}
function loanCalc(l){
  const P=num(l.kiasi),r=num(l.riba),n=Math.max(1,num(l.muda));
  const riba=loanInterest(P,r,n,l.aina)+num(l.ribaYaZamani), total=P+riba, rejesho=round(total/n), mwisho=addMonths(l.tarehe,n);
  const paidP=sumM(x=>x.mkopo===l.id&&x.aina==="Marejesho ya Mkopo");
  const paidR=sumM(x=>x.mkopo===l.id&&x.aina==="Riba ya Mkopo");
  const paidA=sumM(x=>x.mkopo===l.id&&x.aina==="Adhabu ya Mkopo");
  const salio=Math.max(0,P-paidP), deni=salio+Math.max(0,riba-paidR);
  const elapsed=Math.min(n,monthsBetween(l.tarehe,todayISO()));
  const malimbikizo=deni<=0?0:Math.min(deni,Math.max(0,elapsed*rejesho-(paidP+paidR)));
  const hali=deni<=0?"Imelipwa":(malimbikizo>0?"Imechelewa":"Hai");
  return {P,r,n,riba,total,rejesho,mwisho,paidP,paidR,paidA,salio,deni,malimbikizo,hali,adhabu:round(malimbikizo*num(D.settings.adhabuPct)/100)};
}
function schedule(l){
  const c=loanCalc(l),rows=[];let bal=c.P;const pmt=round(pmtOf(c.P,c.r,c.n));
  for(let k=1;k<=c.n;k++){
    const riba=l.aina==="Inayopungua"?round(bal*c.r/100):round(c.riba/c.n);
    let msingi=k===c.n?bal:(l.aina==="Inayopungua"?pmt-riba:round(c.P/c.n));
    bal-=msingi;rows.push({k,tarehe:addMonths(l.tarehe,k),rejesho:riba+msingi,riba,msingi,salio:bal});
  }
  return rows;
}
function activeLoan(mid){for(const l of D.mikopo){if(l.mw===mid&&loanCalc(l).deni>0)return l}return null}
function mStats(mid){
  const hisa=sumM(r=>r.mw===mid&&r.aina==="Hisa"), jamii=sumM(r=>r.mw===mid&&r.aina==="Jamii");
  let deni=0;for(const l of D.mikopo)if(l.mw===mid)deni+=loanCalc(l).deni;
  return {hisa,jamii,deni};
}
function finance(){
  const S=D.settings, byA=a=>sumM(r=>r.aina===a);
  const mapatoMiradi=D.mapato.reduce((s,r)=>s+num(r.kiasi),0);
  const inc={riba:byA("Riba ya Mkopo"),adhabuMk:byA("Adhabu ya Mkopo"),adhabuNy:byA("Adhabu Nyingine"),ada:byA("Ada ya Kujiunga"),miradi:mapatoMiradi,mengineyo:num(S.mapatoMengineyo)};
  const mapato=Object.values(inc).reduce((a,b)=>a+b,0);
  const exp={};for(const k of KUNDI_FAIDA)exp[k]=D.matumizi.filter(r=>r.kundi===k).reduce((s,r)=>s+num(r.kiasi),0);
  const uchakavu=num(S.uchakavu);
  const matumizi=Object.values(exp).reduce((a,b)=>a+b,0)+uchakavu;
  const faida=mapato-matumizi;
  const akiba=Math.max(0,round(faida*num(S.akibaPct)/100));
  const pendekezo=Math.max(0,faida-akiba);
  const kugawa=S.kiasiKilichoamuliwa===""||S.kiasiKilichoamuliwa==null?pendekezo:num(S.kiasiKilichoamuliwa);
  let ribaIliyopangwa=0,ribaIliyolipwa=0,deni=0,mikopoJumla=0,iliyochelewa=0,carriedP=0,salioMsingi=0,malimbikizo=0,deniChelewa=0;
  for(const l of D.mikopo){const c=loanCalc(l);ribaIliyopangwa+=c.riba;ribaIliyolipwa+=c.paidR;deni+=c.deni;salioMsingi+=c.salio;
    if(l.vushwa)carriedP+=c.P;else mikopoJumla+=c.P;
    if(c.hali==="Imechelewa"){iliyochelewa++;malimbikizo+=c.malimbikizo;deniChelewa+=c.deni}}
  const michangoYote=sumM(()=>true);
  const matumiziYote=D.matumizi.reduce((s,r)=>s+num(r.kiasi),0);
  const mtaji=D.miradi.reduce((s,r)=>s+num(r.mtaji),0);
  const pesa=num(S.salioKuanzia)+michangoYote+mapatoMiradi+num(S.mapatoMengineyo)-mikopoJumla-matumiziYote-mtaji;
  const maalumIn=byA("Mchango Mwingine"),maalumOut=D.matumizi.filter(r=>r.kundi==="Matumizi ya Michango Maalum").reduce((s,r)=>s+num(r.kiasi),0);
  const byLengo={};for(const r of D.michango)if(r.aina==="Mchango Mwingine"){const k=r.lengo||"Bila lengo";byLengo[k]=byLengo[k]||{in:0,out:0};byLengo[k].in+=num(r.kiasi)}
  for(const r of D.matumizi)if(r.kundi==="Matumizi ya Michango Maalum"){const k=r.lengo||"Bila lengo";byLengo[k]=byLengo[k]||{in:0,out:0};byLengo[k].out+=num(r.kiasi)}
  const jamiiIn=byA("Jamii"), msaada=D.matumizi.filter(r=>r.kundi==="Msaada wa Jamii").reduce((s,r)=>s+num(r.kiasi),0);
  return {inc,mapato,exp,uchakavu,matumizi,faida,akiba,pendekezo,kugawa,ribaHaijalipwa:Math.max(0,ribaIliyopangwa-ribaIliyolipwa),
    deni,mikopoJumla,iliyochelewa,carriedP,salioMsingi,malimbikizo,deniChelewa,michangoYote,matumiziYote,mtaji,pesa,jamiiIn,msaada,salioJamii:jamiiIn-msaada,maalumIn,maalumOut,salioMaalum:maalumIn-maalumOut,byLengo,hisa:byA("Hisa"),mapatoMiradi};
}
function gawio(){
  const F=finance(),rows=D.wanachama.map(m=>{const s=mStats(m.id);return {m,...s,msingi:s.hisa+s.jamii}});
  const tot=rows.reduce((a,r)=>a+r.msingi,0);
  const kata=D.settings.kataDeni==="NDIYO";
  for(const r of rows){r.pct=tot?r.msingi/tot:0;r.gawio=round(r.pct*F.kugawa);r.jamiiRud=D.settings.rudishaJamii==="NDIYO"?r.jamii:0;
    r.kabla=r.hisa+r.jamiiRud+r.gawio;r.kato=kata?Math.min(r.deni,Math.max(0,r.kabla)):0;r.malipo=r.kabla-r.kato;r.deniVuka=r.deni-r.kato}
  const sum=k=>rows.reduce((a,r)=>a+r[k],0);
  return {rows,tot,F,kata,kiwango:tot?F.kugawa/tot:0,jumla:sum("malipo"),gawioJumla:sum("gawio"),katoJumla:sum("kato"),deniVuka:sum("deniVuka")};
}

  return `<div class="grid two">

      <label>Tarehe<input type="date" name="tarehe" value="${todayISO()}"></label>

      <label class="full">Mkopo (kwa marejesho / riba / adhabu)<select name="mkopo" id="mchMk"></select></label>
      <div class="info full" id="mchInfo">Andika namba ya mwanachama.</div>
      <label>Hisa<input type="number" min="0" name="Hisa" inputmode="numeric"></label>
      <label>Jamii<input type="number" min="0" name="Jamii" inputmode="numeric"></label>
      <label>Marejesho ya mkopo (msingi)<input type="number" min="0" name="Marejesho ya Mkopo" inputmode="numeric"></label>
      <label>Riba ya mkopo<input type="number" min="0" name="Riba ya Mkopo" inputmode="numeric"></label>
      <label>Adhabu ya mkopo<input type="number" min="0" name="Adhabu ya Mkopo" inputmode="numeric"></label>
      <label>Adhabu nyingine<input type="number" min="0" name="Adhabu Nyingine" inputmode="numeric"></label>
      <div class="lengo-wrap"><label>Mchango mwingine (kiasi)<input type="number" min="0" name="Mchango Mwingine" inputmode="numeric"></label>
        <label>Ni kwa ajili ya nini? (lazima ukiweka kiasi)<input name="lengo" list="dlLengo" autocomplete="off" placeholder="mf. Rambirambi, Harusi, T-shirt"></label></div>
      <label class="full">Maelezo<input name="maelezo"></label>
    </div>
    <div class="row" style="margin-top:12px"><b>Jumla: <span id="mchTot">0</span></b><button class="btn right" data-a="saveMchango">Hifadhi Michango</button></div>
  </div>
  <div class="card"><h3>Chuja miamala na makusanyo</h3><div class="form">
    <label>Tarehe<input type="date" id="fTarehe" value="${esc(f.tarehe||"")}"></label>
    <label>Namba ya mwanachama<input id="fMw" list="dlMw" autocomplete="off" value="${esc(f.mw||"")}" placeholder="Wote"><span class="pickname">${fmw?esc(fullName(fmw)):(f.mw?"Namba haipo":"")}</span></label>
    <label>Aina<select id="fAina">${opts(AINA,f.aina,"Zote")}</select></label></div>
    <div class="row noprint" style="margin:10px 0"><button class="btn sec sm" data-a="fLeo">Leo</button><button class="btn sec sm" data-a="fZote">Tarehe zote</button>
      <span class="right"></span>${pdfBtn("Makusanyo_"+(f.tarehe||"tarehe_zote"))}<button class="btn sec sm" data-a="print">Chapisha</button><button class="btn sec sm" data-a="csv" data-t="michango">CSV</button></div>
    <div class="tw"><table class="stmt">
      <tr class="sec"><td>Makusanyo ${f.tarehe?"ya "+fd(f.tarehe):"ya tarehe zote"}${fmw?" - "+esc(fmw.id+" "+fullName(fmw)):""}</td><td>Kiasi</td></tr>
      ${byA.filter(([a])=>!f.aina||a===f.aina).map(([a,v])=>`<tr><td>${a}</td><td>${fm(v)}</td></tr>`).join("")}
      <tr class="big"><td>JUMLA KUU YA MAKUSANYO</td><td>${fm(grand)}</td></tr></table></div>
    <p class="muted">Risiti ${nRis} &middot; wanachama ${nWan} &middot; mistari ${list.length}.</p>
    <div class="info">Kurekebisha au kufuta muamala: utafute kwenye jedwali hapa chini (chuja kwa tarehe au namba, au bonyeza <b>Tarehe zote</b>), kisha bonyeza <b>Hariri</b> au <b>Futa</b> mwanzoni mwa mstari wake.</div>
  </div></div>
  ${table([{t:"Rekebisha",np:1},"Risiti","Tarehe","Namba","Jina","Aina",{t:"Kiasi",n:1},"Mkopo","Maelezo"],
    shown.map(r=>{const m=member(r.mw);return `<tr>${acts([bEdit("editMchango",r.id),bDel("delMchango",r.id)])}<td><a href="#" data-a="showReceipt" data-id="${r.risiti}">${r.risiti}</a></td><td>${fd(r.tarehe)}</td><td>${esc(r.mw)}</td><td>${esc(m?fullName(m):"")}</td><td>${esc(ainaTxt(r))}</td><td class="n">${fm(r.kiasi)}</td><td>${esc(r.mkopo||"")}</td><td>${esc(r.maelezo||"")}</td></tr>`}),
    list.length?`<tr class="tot"><td class="noprint"></td><td colspan="5">JUMLA</td><td class="n">${fm(grand)}</td><td colspan="2"></td></tr>`:"")}`;
};

R.kikao=()=>{
  const tab=state.tab||"ingiza";
  const tabs=`<div class="row noprint" style="margin-bottom:12px"><button class="btn ${tab==="ingiza"?"":"sec"}" data-a="ktab" data-t="ingiza">Ingiza michango ya kikao</button><button class="btn ${tab==="muhtasari"?"":"sec"}" data-a="ktab" data-t="muhtasari">Muhtasari wa vikao</button></div>`;
  if(tab==="muhtasari")return tabs+kikaoSummaryView();
  const ms=D.wanachama.filter(m=>m.hali!=="Amejitoa");
  const cols=AINA;
  return tabs+`<div class="card"><div class="row"><h3 style="margin:0">Kikao - michango ya wanachama wote</h3>
    <label class="right" style="flex-direction:row;align-items:center;gap:8px">Tarehe ya kikao<input type="date" id="kTarehe" value="${esc(state.tarehe||todayISO())}" style="width:auto"></label></div>
    <p class="muted">Jaza kiasi cha kila mwanachama na tiki <b>Yupo</b> kwa aliyehudhuria, kisha Hifadhi. Au pakua Excel ya kikao, ijaze, kisha ipakie hapa: itajaza jedwali, nawe utakagua kabla ya kuhifadhi.</p>
    <div class="row" style="margin:8px 0"><button class="btn sec" data-a="kikaoTemplate">1. Pakua Excel ya kikao</button><button class="btn sec" data-a="kikaoImport">2. Pakia Excel ya kikao</button><button class="btn ghost sm right" data-a="kikaoClear">Safisha jedwali</button></div>
    <label style="max-width:420px">Mchango mwingine wa kikao hiki ni kwa ajili ya nini?<input id="kLengo" list="dlLengo" autocomplete="off" placeholder="mf. Rambirambi, Harusi, T-shirt"></label></div>
  ${ms.length?`<div class="tw"><table id="kTbl"><thead><tr><th>Mwanachama</th><th>Yupo</th>${cols.map(c=>`<th class="n">${c}</th>`).join("")}<th class="n">Jumla</th><th>Mkopo</th><th class="n">Rejesho</th><th class="n">Malimbikizo</th></tr></thead><tbody>
  ${ms.map(m=>{const l=activeLoan(m.id),c=l?loanCalc(l):null;return `<tr data-mw="${m.id}"><td>${esc(m.id+" - "+fullName(m))}<div class="muted kl"></div></td><td style="text-align:center"><input type="checkbox" class="yupo" style="width:20px;height:20px"></td>${cols.map(c2=>`<td><input type="number" min="0" data-c="${c2}" style="width:105px;padding:6px" ${LOAN_TYPES.includes(c2)&&!l?"disabled title='Hana mkopo unaodaiwa'":""}></td>`).join("")}
  <td class="n rt">0</td><td>${l?l.id:"-"}</td><td class="n">${c?fm(c.rejesho):""}</td><td class="n">${c?fm(c.malimbikizo):""}</td></tr>`}).join("")}
  <tr class="tot"><td>JUMLA</td><td class="n" id="kYupo">0</td>${cols.map(c=>`<td class="n" data-ct="${c}">0</td>`).join("")}<td class="n" id="kGrand">0</td><td colspan="3"></td></tr>
  </tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn right" data-a="saveKikao">Hifadhi Kikao na Tengeneza Muhtasari</button></div>`:`<div class="empty card">Hakuna wanachama. Sajili wanachama kwanza.</div>`}`;
};
function kikaoDates(){const set=new Set(D.vikao.map(v=>v.tarehe));for(const r of D.michango)if(r.maelezo==="Kikao")set.add(r.tarehe);return [...set].sort()}
function cashAt(d){const S=D.settings,le=r=>r.tarehe<=d;
  return num(S.salioKuanzia)+num(S.mapatoMengineyo)+D.michango.filter(le).reduce((t,r)=>t+num(r.kiasi),0)+D.mapato.filter(le).reduce((t,r)=>t+num(r.kiasi),0)
    -D.mikopo.filter(l=>!l.vushwa&&le(l)).reduce((t,l)=>t+num(l.kiasi),0)-D.matumizi.filter(le).reduce((t,r)=>t+num(r.kiasi),0)-D.miradi.filter(le).reduce((t,r)=>t+num(r.mtaji),0)}
function kikaoSummaryView(){
  const dates=kikaoDates(),d=state.tarehe||dates[dates.length-1]||todayISO();
  const rec=D.vikao.find(v=>v.tarehe===d)||{tarehe:d,hudhurio:[],maazimio:""};
  const tx=D.michango.filter(r=>r.tarehe===d),loans=D.mikopo.filter(l=>!l.vushwa&&l.tarehe===d),mt=D.matumizi.filter(r=>r.tarehe===d),mp=D.mapato.filter(r=>r.tarehe===d);
  const active=D.wanachama.filter(m=>m.hali!=="Amejitoa");
  const present=new Set(rec.hudhurio.concat(tx.map(r=>r.mw)));
  const absent=active.filter(m=>!present.has(m.id));
  const tr=(l,v,c)=>`<tr class="${c||""}"><td>${l}</td><td>${v}</td></tr>`;
  const byA=AINA.map(a=>{const rs=tx.filter(r=>r.aina===a);return [a,rs.reduce((t,r)=>t+num(r.kiasi),0),new Set(rs.map(r=>r.mw)).size]}).filter(x=>x[1]>0);
  const lengos={};for(const r of tx)if(r.aina==="Mchango Mwingine"){const k=r.lengo||"Bila lengo";lengos[k]=(lengos[k]||0)+num(r.kiasi)}
  const makusanyo=tx.reduce((t,r)=>t+num(r.kiasi),0),mapato=mp.reduce((t,r)=>t+num(r.kiasi),0);
  const nje=loans.reduce((t,l)=>t+num(l.kiasi),0)+mt.reduce((t,r)=>t+num(r.kiasi),0)+D.miradi.filter(r=>r.tarehe===d).reduce((t,r)=>t+num(r.mtaji),0);
  const usedCols=AINA.filter(a=>tx.some(r=>r.aina===a));
  const per=[...new Set(tx.map(r=>r.mw))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(id=>{const v=usedCols.map(a=>tx.filter(r=>r.mw===id&&r.aina===a).reduce((t,r)=>t+num(r.kiasi),0));return {id,v,t:v.reduce((a,b)=>a+b,0)}});
  const prev=dates.filter(x=>x<d).pop(),hisaD=D.michango.filter(r=>r.aina==="Hisa"&&r.tarehe<=d).reduce((t,r)=>t+num(r.kiasi),0);
  const jamiiD=D.michango.filter(r=>r.aina==="Jamii"&&r.tarehe<=d).reduce((t,r)=>t+num(r.kiasi),0)-D.matumizi.filter(r=>r.kundi==="Msaada wa Jamii"&&r.tarehe<=d).reduce((t,r)=>t+num(r.kiasi),0);
  const late=D.mikopo.map(l=>({l,c:loanCalc(l)})).filter(x=>x.c.hali==="Imechelewa");
  const F=finance(),idx=dates.indexOf(d)+1;
  return `<div class="card noprint"><div class="row"><label style="flex-direction:row;align-items:center;gap:8px">Kikao cha tarehe<select id="ksDate">${(dates.includes(d)?dates:dates.concat([d]).sort()).slice().reverse().map(x=>`<option value="${x}" ${x===d?"selected":""}>${fd(x)}</option>`).join("")}</select></label>
    <label style="flex-direction:row;align-items:center;gap:8px">au chagua tarehe<input type="date" id="ksAny" value="${d}" style="width:auto"></label>
    <span class="right"></span>${pdfBtn("Muhtasari_Kikao_"+d)}<button class="btn sec" data-a="print">Chapisha</button><button class="btn sec" data-a="kikaoXl" data-d="${d}">Pakua Excel</button></div></div>
  <div class="card" id="ksDoc">
    ${pdfHead("Muhtasari wa Kikao",fd(d))}
    <div style="text-align:center;margin-bottom:12px"><div class="bn" style="color:var(--g)">VICOBA SYSTEM</div><h2 style="margin:4px 0">${esc(D.settings.jina)}</h2>
      <b>MUHTASARI WA KIKAO${idx?" NA. "+idx:""}</b><div class="muted">Tarehe: ${fd(d)}${prev?" &middot; Kikao kilichopita: "+fd(prev):""}</div></div>
    <div class="grid kpis" style="margin-bottom:14px">
      <div class="kpi"><div class="l">Mahudhurio</div><div class="v">${present.size} / ${active.length}</div></div>
      <div class="kpi"><div class="l">Makusanyo ya kikao</div><div class="v">${fm(makusanyo)}</div></div>
      <div class="kpi"><div class="l">Mikopo iliyotolewa</div><div class="v">${fm(loans.reduce((t,l)=>t+num(l.kiasi),0))}</div></div>
      <div class="kpi ${cashAt(d)<0?"warn":""}"><div class="l">Pesa baada ya kikao</div><div class="v">${fm(cashAt(d))}</div></div></div>
    <h3>1. Mahudhurio</h3>
    <p>Waliohudhuria: <b>${present.size}</b> kati ya wanachama hai ${active.length}.${absent.length?` Wasiohudhuria (${absent.length}): ${absent.map(m=>esc(m.id+" "+fullName(m))).join(", ")}.`:" Wote walihudhuria."}</p>
    <h3 style="margin-top:14px">2. Makusanyo</h3>
    ${byA.length?`<div class="tw"><table class="stmt"><tr class="sec"><td>Aina ya mchango (idadi ya waliochanga)</td><td>Kiasi</td></tr>${byA.map(([a,v,n])=>tr(esc(a)+` <span class="muted">(${n})</span>`,fm(v))).join("")}
      ${Object.keys(lengos).length?Object.entries(lengos).map(([k,v])=>tr(`<span class="muted">&nbsp;&nbsp;&nbsp;Mchango mwingine: ${esc(k)}</span>`,fm(v))).join(""):""}
      ${tr("JUMLA KUU YA MAKUSANYO",fm(makusanyo),"big")}</table></div>`:`<p class="muted">Hakuna michango iliyorekodiwa tarehe hii.</p>`}
    ${per.length?`<h3 style="margin-top:14px">3. Michango kwa kila mwanachama</h3>`+table(["Namba","Jina",...usedCols.map(c=>({t:c,n:1})),{t:"Jumla",n:1}],per.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(fullName(member(r.id)||{}))}</td>${r.v.map(x=>`<td class="n">${x?fm(x):""}</td>`).join("")}<td class="n"><b>${fm(r.t)}</b></td></tr>`),
      `<tr class="tot"><td colspan="2">JUMLA</td>${usedCols.map((c,i)=>`<td class="n">${fm(per.reduce((a,r)=>a+r.v[i],0))}</td>`).join("")}<td class="n">${fm(makusanyo)}</td></tr>`):""}
    <h3 style="margin-top:14px">4. Mikopo iliyotolewa</h3>
    ${loans.length?table(["Mkopo","Mwanachama",{t:"Kiasi",n:1},"Riba",{t:"Miezi",n:1},{t:"Rejesho/Mwezi",n:1},"Wadhamini"],loans.map(l=>{const c=loanCalc(l);return `<tr><td>${l.id}</td><td>${esc(memberLabel(l.mw))}</td><td class="n">${fm(c.P)}</td><td>${l.riba}% ${esc(l.aina)}</td><td class="n">${l.muda}</td><td class="n">${fm(c.rejesho)}</td><td>${esc(guarantorText(l))}</td></tr>`}),
      `<tr class="tot"><td colspan="2">JUMLA</td><td class="n">${fm(loans.reduce((t,l)=>t+num(l.kiasi),0))}</td><td colspan="4"></td></tr>`):`<p class="muted">Hakuna mkopo uliotolewa kwenye kikao hiki.</p>`}
    <h3 style="margin-top:14px">5. Matumizi na mapato mengine ya siku</h3>
    ${mt.length||mp.length?table(["Aina","Maelezo",{t:"Kiasi",n:1}],mt.map(r=>`<tr><td>Matumizi: ${esc(r.kundi)}${r.lengo?" ("+esc(r.lengo)+")":""}</td><td>${esc(r.maelezo||"")}</td><td class="n">-${fm(r.kiasi)}</td></tr>`).concat(mp.map(r=>`<tr><td>Mapato ya mradi ${esc(r.mradi)}</td><td>${esc(r.maelezo||"")}</td><td class="n">${fm(r.kiasi)}</td></tr>`))):`<p class="muted">Hakuna.</p>`}
    <h3 style="margin-top:14px">6. Hali ya fedha</h3>
    <div class="tw"><table class="stmt">${tr("Pesa kabla ya kikao",fm(cashAt(d)-makusanyo-mapato+nje))}${tr("Pesa iliyoingia (makusanyo + mapato)",fm(makusanyo+mapato))}${tr("Pesa iliyotoka (mikopo + matumizi)","-"+fm(nje))}${tr("PESA BAADA YA KIKAO",fm(cashAt(d)),"big")}
      ${tr("Jumla ya hisa hadi kikao hiki",fm(hisaD))}${tr("Mfuko wa jamii hadi kikao hiki",fm(jamiiD))}${tr("Mikopo inayodaiwa (kwa sasa)",fm(F.deni))}</table></div>
    ${late.length?`<h3 style="margin-top:14px">7. Mikopo iliyochelewa (kwa sasa)</h3>`+table(["Mkopo","Mwanachama",{t:"Malimbikizo",n:1},{t:"Adhabu Inayopendekezwa",n:1}],late.map(x=>`<tr><td>${x.l.id}</td><td>${esc(memberLabel(x.l.mw))}</td><td class="n">${fm(x.c.malimbikizo)}</td><td class="n">${fm(x.c.adhabu)}</td></tr>`)):""}
    <h3 style="margin-top:14px">${late.length?8:7}. Maazimio na mengineyo</h3>
    <textarea id="ksNotes" rows="5" class="noprint" placeholder="Andika maamuzi ya kikao, mambo yaliyojadiliwa, na tarehe ya kikao kijacho...">${esc(rec.maazimio||"")}</textarea>
    <div class="printonly" style="white-space:pre-wrap">${esc(rec.maazimio||"")||"................................................................"}</div>
    <div class="row noprint" style="margin-top:8px"><button class="btn sec sm" data-a="saveNotes" data-d="${d}">Hifadhi Maazimio</button></div>
    ${sigBlock()}
  </div>`;
}

R.mikopo=()=>{
  const S=D.settings;
  const rows=D.mikopo.slice().reverse().map(l=>{const c=loanCalc(l);return `<tr>${acts([bEdit("editLoan",l.id),bDel("delLoan",l.id)])}<td>${l.id}${l.vushwa?' <span class="chip hai">imevushwa</span>':""}</td><td>${fd(l.tarehe)}</td><td>${esc(memberLabel(l.mw))}</td><td class="n">${fm(c.P)}</td><td>${l.vushwa?"Deni la zamani":l.riba+"% "+esc(l.aina)}</td><td class="n">${l.muda}</td>
    <td class="n">${fm(c.riba)}</td><td class="n">${fm(c.rejesho)}</td><td class="n">${fm(c.paidP)}</td><td class="n">${fm(c.paidR)}</td><td class="n">${fm(c.deni)}</td><td class="n">${fm(c.malimbikizo)}</td><td>${chip(c.hali)}</td><td>${esc(guarantorText(l))}</td>

      <label>Kiasi cha mkopo<input type="number" min="0" name="kiasi" inputmode="numeric"></label>
      <label>Riba (% kwa mwezi)<input type="number" min="0" step="0.01" name="riba" value="${esc(S.riba)}"></label>
      <label>Aina ya riba<select name="aina">${opts(["Flat","Inayopungua"],S.ainaRiba)}</select></label>
      <label>Muda (miezi)<input type="number" min="1" step="1" name="muda"></label>
      ${picker("mdhamini1","","Mdhamini wa 1 (hiari)")}${picker("mdhamini2","","Mdhamini wa 2 (hiari)")}

  </div>
  <div class="row" style="margin-bottom:8px"><h3 style="margin:0">Rejesta ya mikopo</h3><button class="btn sec sm right" data-a="csv" data-t="mikopo">Pakua CSV</button></div>
  ${table([{t:"Rekebisha",np:1},"Namba","Tarehe","Mwanachama",{t:"Kiasi",n:1},"Riba",{t:"Miezi",n:1},{t:"Jumla Riba",n:1},{t:"Rejesho/Mwezi",n:1},{t:"Msingi Uliolipwa",n:1},{t:"Riba Iliyolipwa",n:1},{t:"Inayodaiwa",n:1},{t:"Malimbikizo",n:1},"Hali","Wadhamini",""],rows)}`;
};

R.miradi=()=>{
  return `<div class="grid two">
  <div class="card" id="mrForm"><h3>Sajili mradi</h3><div class="form">
    <label>Jina la mradi<input name="jina"></label><label>Tarehe ya kuanza<input type="date" name="tarehe" value="${todayISO()}"></label>

    <label class="full">Maelezo<input name="maelezo"></label></div>
    <p class="muted">Mtaji ni pesa iliyowekezwa (mali ya kikundi), si matumizi - haupunguzi faida moja kwa moja.</p>
    <div class="row"><button class="btn right" data-a="saveMradi">Sajili Mradi</button></div></div>

    <label>Tarehe<input type="date" name="tarehe" value="${todayISO()}"></label>
    <label>Mradi<select name="mradi"><option value="">-- Chagua mradi --</option>${D.miradi.map(p=>`<option value="${p.id}">${esc(p.id+" - "+p.jina)}</option>`).join("")}</select></label>
    <label>Kiasi<input type="number" min="0" name="kiasi"></label><label>Maelezo<input name="maelezo"></label></div>
    <div class="row" style="margin-top:12px"><button class="btn right" data-a="saveMapato">Hifadhi Mapato</button></div></div></div>
  <h3>Miradi</h3>

  ${tr("JUMLA YA MAPATO",fm(F.mapato),"tot")}
  ${tr("B. MATUMIZI (yanayopunguza faida)","","sec")}
  ${Object.entries(F.exp).map(([k,v])=>tr(k,fm(v))).join("")}
  ${tr("Uchakavu / hasara ya miradi (uamuzi wa kikundi)",`<input type="number" min="0" data-s="uchakavu" value="${esc(S.uchakavu)}">`)}
  ${tr("JUMLA YA MATUMIZI",fm(F.matumizi),"tot")}
  ${tr("FAIDA HALISI (A - B)",fm(F.faida),"big")}
  ${tr("<span class='muted'>Taarifa: riba iliyopangwa ambayo bado haijalipwa (haimo kwenye faida)</span>",fm(F.ribaHaijalipwa))}
  ${tr("C. MGAWANYO WA FAIDA","","sec")}
  ${tr("Asilimia ya kubaki kama akiba ya kikundi (%)",`<input type="number" min="0" max="100" data-s="akibaPct" value="${esc(S.akibaPct)}">`)}
  ${tr("Akiba ya kikundi",fm(F.akiba))}${tr("Kiasi kinachopendekezwa kugawanywa",fm(F.pendekezo))}
  ${tr("Kiasi kilichoamuliwa na kikundi (acha wazi kutumia pendekezo)",`<input type="number" min="0" data-s="kiasiKilichoamuliwa" value="${esc(S.kiasiKilichoamuliwa)}">`)}
  ${tr("KIASI CHA KUGAWANYA",fm(F.kugawa),"big")}
  ${tr("D. HALI YA FEDHA","","sec")}
  ${tr("Salio la kuanzia mzunguko",fm(S.salioKuanzia))}${tr("Michango yote iliyopokelewa",fm(F.michangoYote))}${tr("Mapato ya miradi",fm(F.mapatoMiradi))}
  ${tr("Mapato mengineyo",fm(S.mapatoMengineyo))}${tr("Mikopo iliyotolewa","-"+fm(F.mikopoJumla))}${tr("Matumizi yote (pamoja na msaada wa jamii)","-"+fm(F.matumiziYote))}
  ${tr("Mtaji uliowekwa kwenye miradi","-"+fm(F.mtaji))}${tr("PESA ILIYOPO SASA",fm(F.pesa),"big")}
  ${tr("E. MFUKO WA JAMII","","sec")}
  ${tr("Michango ya jamii",fm(F.jamiiIn))}${tr("Msaada wa jamii uliotolewa",fm(F.msaada))}${tr("Salio la mfuko wa jamii",fm(F.salioJamii),"tot")}
  ${tr("F. MICHANGO MAALUM (haimo kwenye faida wala gawio)","","sec")}
  ${Object.keys(F.byLengo).length?Object.entries(F.byLengo).map(([k,b])=>tr(esc(k)+` <span class="muted">(imekusanywa ${fm(b.in)}, imetumika ${fm(b.out)})</span>`,fm(b.in-b.out))).join(""):tr("<span class='muted'>Hakuna michango maalum bado</span>","")}

R.gawio=()=>{
  const G=gawio(),F=G.F,S=D.settings,kila=round(G.kiwango*1000);
  const k=(l,v,w)=>`<div class="kpi ${w?"warn":""}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  return `<div class="card"><h2>Gawio la faida - mwisho wa mzunguko</h2>
  <div class="grid kpis" style="margin-bottom:12px">
    ${k("Faida halisi",fm(F.faida))}${k("Kiasi cha kugawanya",fm(F.kugawa))}${k("Jumla ya mawekezo (hisa + jamii)",fm(G.tot))}
    ${k("Kila 1,000 iliyowekezwa imezalisha",fm(kila))}${k("Jumla ya malipo",fm(G.jumla))}${k("Pesa iliyopo",fm(F.pesa),F.pesa<0||G.jumla>F.pesa)}</div>
  ${!G.tot?`<div class="info">Hakuna mawekezo (hisa au jamii) bado, kwa hiyo hakuna gawio la kuhesabu. Gawio litaonekana wanachama wakianza kuchanga.</div>`:`<div class="info" style="line-height:1.7">
    <b>Jinsi gawio linavyopatikana</b><br>
    1. Faida halisi ${fm(F.faida)} &minus; akiba ya kikundi ${fm(F.akiba)} = kiasi cha kugawanya <b>${fm(F.kugawa)}</b>${S.kiasiKilichoamuliwa!==""?" (kiasi kilichoamuliwa na kikundi)":""}.<br>
    2. Mawekezo ya kila mwanachama = Hisa + Jamii zake. Jumla ya mawekezo ya wanachama wote = <b>${fm(G.tot)}</b>.<br>
    3. Kiwango cha faida = ${fm(F.kugawa)} &divide; ${fm(G.tot)} = <b>${(G.kiwango*100).toFixed(2)}%</b> ya mawekezo (kila 1,000 &rarr; ${fm(kila)}).<br>
    4. Gawio la mwanachama = mawekezo yake &times; ${(G.kiwango*100).toFixed(2)}%. Aliyewekeza zaidi anapata zaidi kwa uwiano ule ule.
  </div>`}
  <div class="form noprint" style="margin-top:12px">
    <label>Rudisha jamii kwenye malipo?<select data-s="rudishaJamii">${opts(["NDIYO","HAPANA"],S.rudishaJamii)}</select></label>
    <label>Kata deni la mkopo kwenye malipo?<select data-s="kataDeni">${opts(["HAPANA","NDIYO"],S.kataDeni)}</select></label>
  </div>
  <p class="muted">${G.kata?"Deni linakatwa kwenye malipo ya mwanachama; sehemu isiyokatika inavuka kwenda mzunguko ujao.":"Deni halikatwi: mwanachama analipwa kamili na deni lake linavuka kwenda mzunguko ujao."}</p>
  ${moneyAlerts(F)}
  ${G.jumla>0&&G.jumla>F.pesa&&F.pesa>=0?`<div class="alert bad">Malipo yanazidi pesa iliyopo kwa ${fm(G.jumla-F.pesa)}. Kusanya madeni, kata madeni, au punguza kiasi cha kugawa (ukurasa wa Faida).</div>`:""}
  </div>
  ${table(["Namba","Jina",{t:"Hisa",n:1},{t:"Jamii",n:1},{t:"Mawekezo",n:1},{t:"Sehemu ya mawekezo",n:1},"Hesabu ya gawio",{t:"Gawio (faida)",n:1},{t:"Mawekezo + Gawio",n:1},{t:"Deni",n:1},{t:"Kato la deni",n:1},{t:"Deni linalovuka",n:1},{t:"MALIPO YA MWISHO",n:1}],
    G.rows.map(r=>`<tr><td>${esc(r.m.id)}</td><td>${esc(fullName(r.m))}</td><td class="n">${fm(r.hisa)}</td><td class="n">${fm(r.jamii)}</td><td class="n"><b>${fm(r.msingi)}</b></td><td class="n">${(r.pct*100).toFixed(2)}%</td>
      <td class="muted">${fm(r.msingi)} &times; ${(G.kiwango*100).toFixed(2)}%</td><td class="n"><b>${fm(r.gawio)}</b></td><td class="n">${fm(r.msingi+r.gawio)}</td><td class="n">${fm(r.deni)}</td><td class="n">${fm(r.kato)}</td><td class="n">${fm(r.deniVuka)}</td><td class="n"><b>${fm(r.malipo)}</b></td></tr>`),
    `<tr class="tot"><td colspan="2">JUMLA (wanachama ${G.rows.length})</td><td class="n">${fm(G.rows.reduce((a,r)=>a+r.hisa,0))}</td><td class="n">${fm(G.rows.reduce((a,r)=>a+r.jamii,0))}</td><td class="n">${fm(G.tot)}</td><td class="n">100%</td><td></td><td class="n">${fm(G.gawioJumla)}</td><td class="n">${fm(G.tot+G.gawioJumla)}</td><td class="n">${fm(G.rows.reduce((a,r)=>a+r.deni,0))}</td><td class="n">${fm(G.katoJumla)}</td><td class="n">${fm(G.deniVuka)}</td><td class="n">${fm(G.jumla)}</td></tr>`)}
  ${G.tot?`<p class="muted">Tofauti ya kuzungusha (rounding): ${fm(F.kugawa-G.gawioJumla)}</p>`:""}
  <div class="row noprint" style="margin-top:12px">${pdfBtn("Gawio_"+todayISO())}<button class="btn sec" data-a="csv" data-t="gawio">Pakua CSV</button><button class="btn sec" data-a="print">Chapisha</button></div>`;
};

R.taarifa=()=>{
  const id=state.id||"",m=member(id);
  let body="";
  if(m){const s=mStats(id),G=gawio(),g=G.rows.find(r=>r.m.id===id)||{};
    const tx=D.michango.filter(r=>r.mw===id),lo=D.mikopo.filter(l=>l.mw===id);
    const t=a=>sumM(r=>r.mw===id&&r.aina===a);
    body=`<div class="card"><h2>${esc(m.id+" - "+fullName(m))}</h2><p class="muted">Simu: ${esc(m.simu)} &nbsp;|&nbsp; Anuani: ${esc(m.anuani)} &nbsp;|&nbsp; Alijiunga: ${fd(m.tarehe)} &nbsp;|&nbsp; Hali: ${esc(m.hali)}</p>
    <div class="grid kpis">${[["Hisa",s.hisa],["Jamii",s.jamii],["Marejesho",t("Marejesho ya Mkopo")],["Riba iliyolipwa",t("Riba ya Mkopo")],["Adhabu",t("Adhabu ya Mkopo")+t("Adhabu Nyingine")],["Michango mingine",t("Mchango Mwingine")],["Deni la sasa",s.deni],["Gawio linalotarajiwa",g.gawio||0],["Malipo ya mwisho",g.malipo||0]]
      .map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${fm(v)}</div></div>`).join("")}</div></div>
    <h3>Miamala</h3>${table([{t:"Rekebisha",np:1},"Tarehe","Risiti","Aina",{t:"Kiasi",n:1},"Mkopo","Maelezo"],tx.map(r=>`<tr>${acts([bEdit("editMchango",r.id),bDel("delMchango",r.id)])}<td>${fd(r.tarehe)}</td><td>${r.risiti}</td><td>${esc(ainaTxt(r))}</td><td class="n">${fm(r.kiasi)}</td><td>${esc(r.mkopo||"")}</td><td>${esc(r.maelezo||"")}</td></tr>`))}
    <h3 style="margin-top:16px">Mikopo</h3>${table(["Namba","Tarehe",{t:"Kiasi",n:1},"Riba",{t:"Rejesho/Mwezi",n:1},{t:"Inayodaiwa",n:1},"Hali",""],lo.map(l=>{const c=loanCalc(l);return `<tr><td>${l.id}</td><td>${fd(l.tarehe)}</td><td class="n">${fm(c.P)}</td><td>${l.riba}% ${esc(l.aina)}</td><td class="n">${fm(c.rejesho)}</td><td class="n">${fm(c.deni)}</td><td>${chip(c.hali)}</td><td class="noprint"><button class="btn ghost sm" data-a="editLoan" data-id="${l.id}">Hariri</button></td></tr>`}))}
    ${(()=>{const gl=D.mikopo.filter(l=>l.mdhamini1===id||l.mdhamini2===id);return gl.length?`<h3 style="margin-top:16px">Mikopo aliyodhamini</h3>`+table(["Mkopo","Mkopaji",{t:"Inayodaiwa",n:1},"Hali"],gl.map(l=>{const c=loanCalc(l);return `<tr><td>${l.id}</td><td>${esc(memberLabel(l.mw))}</td><td class="n">${fm(c.deni)}</td><td>${chip(c.hali)}</td></tr>`})):""})()}
    ${sigBlock()}<div class="row noprint" style="margin-top:12px">${pdfBtn("Taarifa_"+id+"_"+todayISO())}<button class="btn sec" data-a="print">Chapisha Taarifa</button><button class="btn sec" data-a="memberForm" data-id="${esc(id)}">&#9998; Hariri taarifa za mwanachama</button><button class="btn del" data-a="delMember" data-id="${esc(id)}">&#128465; Futa mwanachama</button></div>`;}
  return `<div class="card noprint"><h3>Taarifa ya mwanachama</h3><label style="max-width:420px">Namba ya mwanachama<input id="tMw" list="dlMw" autocomplete="off" value="${esc(id)}" placeholder="Andika namba"></label></div>${body}`;
};

R.ripoti=()=>{
  const S=D.settings,F=finance(),from=state.from||S.anza,to=state.to||todayISO(),tab=state.tab||"mm";
  const inP=r=>r.tarehe>=from&&r.tarehe<=to,before=r=>r.tarehe<from;
  const sumA=(a,f)=>D.michango.filter(r=>r.aina===a&&f(r)).reduce((t,r)=>t+num(r.kiasi),0);
  const tr=(l,v,c)=>`<tr class="${c||""}"><td>${l}</td><td>${v}</td></tr>`;
  const tabs=[["mm","Mapato na Matumizi"],["hf","Hali ya Fedha"],["mk","Mikopo"],["mc","Michango kwa Mwanachama"],["ml","Michango Maalum"]];
  let body="";
  if(tab==="mm"){
    const inc=[["Riba ya mikopo",sumA("Riba ya Mkopo",inP)],["Adhabu za mikopo",sumA("Adhabu ya Mkopo",inP)],["Adhabu nyinginezo",sumA("Adhabu Nyingine",inP)],
      ["Ada za kujiunga",sumA("Ada ya Kujiunga",inP)],["Mapato ya miradi",D.mapato.filter(inP).reduce((t,r)=>t+num(r.kiasi),0)]];
    const ti=inc.reduce((t,x)=>t+x[1],0);
    const exp=KUNDI_FAIDA.map(k=>[k,D.matumizi.filter(r=>r.kundi===k&&inP(r)).reduce((t,r)=>t+num(r.kiasi),0)]);
    const te=exp.reduce((t,x)=>t+x[1],0),msaada=D.matumizi.filter(r=>r.kundi==="Msaada wa Jamii"&&inP(r)).reduce((t,r)=>t+num(r.kiasi),0);
    body=`<div class="tw"><table class="stmt">${tr("MAPATO","","sec")}${inc.map(([l,v])=>tr(l,fm(v))).join("")}${tr("Jumla ya mapato",fm(ti),"tot")}
      ${tr("MATUMIZI","","sec")}${exp.map(([l,v])=>tr(l,fm(v))).join("")}${tr("Jumla ya matumizi",fm(te),"tot")}
      ${tr("ZIADA / FAIDA YA KIPINDI",fm(ti-te),"big")}
      ${tr("<span class='muted'>Msaada wa jamii uliotolewa (kutoka mfuko wa jamii)</span>",fm(msaada))}</table></div>
      <p class="muted">Mapato mengineyo ya Mipangilio (${fm(S.mapatoMengineyo)}) na uchakavu wa miradi (${fm(S.uchakavu)}) ni ya mzunguko mzima, kwa hiyo yako kwenye ukurasa wa Faida, si hapa.</p>`;
  }else if(tab==="hf"){
    const mtajiNet=F.mtaji-num(S.uchakavu),mali=F.pesa+F.salioMsingi+mtajiNet;
    const mtajiKuanzia=num(S.salioKuanzia)+F.carriedP,dhima=F.hisa+F.salioJamii+F.salioMaalum+mtajiKuanzia+F.faida;
    const flow=f=>{const i=D.michango.filter(f).reduce((t,r)=>t+num(r.kiasi),0)+D.mapato.filter(f).reduce((t,r)=>t+num(r.kiasi),0);
      const o=D.mikopo.filter(l=>!l.vushwa&&f(l)).reduce((t,l)=>t+num(l.kiasi),0)+D.matumizi.filter(f).reduce((t,r)=>t+num(r.kiasi),0)+D.miradi.filter(f).reduce((t,r)=>t+num(r.mtaji),0);return [i,o]};
    const [ib,ob]=flow(before),open=num(S.salioKuanzia)+num(S.mapatoMengineyo)+ib-ob;
    const ins=AINA.map(a=>[a,sumA(a,inP)]).concat([["Mapato ya miradi",D.mapato.filter(inP).reduce((t,r)=>t+num(r.kiasi),0)]]);
    const outs=[["Mikopo iliyotolewa",D.mikopo.filter(l=>!l.vushwa&&inP(l)).reduce((t,l)=>t+num(l.kiasi),0)],["Matumizi (yote)",D.matumizi.filter(inP).reduce((t,r)=>t+num(r.kiasi),0)],["Mtaji wa miradi",D.miradi.filter(inP).reduce((t,r)=>t+num(r.mtaji),0)]];
    const ti=ins.reduce((t,x)=>t+x[1],0),to_=outs.reduce((t,x)=>t+x[1],0);
    body=`<div class="grid two"><div><h3>Mizania (hali kwa sasa)</h3><div class="tw"><table class="stmt">
      ${tr("MALI ZA KIKUNDI","","sec")}${tr("Pesa taslimu / benki / simu",fm(F.pesa))}${tr("Mikopo inayodaiwa (msingi)",fm(F.salioMsingi))}${tr("Mali ya miradi (mtaji - uchakavu)",fm(mtajiNet))}${tr("JUMLA YA MALI",fm(mali),"big")}
      ${tr("MTAJI WA WANACHAMA NA KIKUNDI","","sec")}${tr("Hisa za wanachama",fm(F.hisa))}${tr("Mfuko wa jamii",fm(F.salioJamii))}${tr("Michango maalum (salio)",fm(F.salioMaalum))}${tr("Mtaji wa kuanzia (salio + madeni yaliyovuka)",fm(mtajiKuanzia))}${tr("Faida ya mzunguko hadi sasa",fm(F.faida))}${tr("JUMLA",fm(dhima),"big")}
      </table></div>${Math.abs(mali-dhima)<1?`<div class="alert ok" style="margin-top:8px">Mizania imelingana.</div>`:`<div class="alert bad" style="margin-top:8px">Mizania haijalingana kwa ${fm(mali-dhima)}. Angalia salio la kuanzia kwenye Mipangilio.</div>`}
      <p class="muted">Riba inayodaiwa (${fm(F.ribaHaijalipwa)}) haihesabiwi kama mali mpaka ilipwe.</p></div>
      <div><h3>Mtiririko wa fedha (kipindi)</h3><div class="tw"><table class="stmt">
      ${tr("Pesa mwanzo wa kipindi",fm(open),"tot")}${tr("PESA ILIYOINGIA","","sec")}${ins.map(([l,v])=>tr(l,fm(v))).join("")}${tr("Jumla iliyoingia",fm(ti),"tot")}
      ${tr("PESA ILIYOTOKA","","sec")}${outs.map(([l,v])=>tr(l,fm(v))).join("")}${tr("Jumla iliyotoka",fm(to_),"tot")}${tr("PESA MWISHO WA KIPINDI",fm(open+ti-to_),"big")}</table></div></div></div>`;
  }else if(tab==="mk"){
    const iss=D.mikopo.filter(l=>!l.vushwa&&inP(l)),pp=sumA("Marejesho ya Mkopo",inP),pr=sumA("Riba ya Mkopo",inP),pa=sumA("Adhabu ya Mkopo",inP);

function pdfHead(title,sub){const now=new Date();
  return `<div class="pdfhead">${LOGO}<div><div class="t">${esc(D.settings.jina)} &middot; ${esc(title)}</div>
  <div class="m">VICOBA SYSTEM${sub?" &middot; "+esc(sub):""} &middot; Imetolewa ${fd(toISO(now))} saa ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}</div></div></div>`}
function pdfBtn(name,label){return `<button class="btn pdf noprint" data-a="savePdf" data-n="${esc(name)}">&#128196; ${label||"Hifadhi PDF"}</button>`}
A.savePdf=async el=>{
  const name=(slug()+"_"+el.dataset.n).replace(/[^A-Za-z0-9_\-]+/g,"_").replace(/_+/g,"_");
  closeDlg();
  if(window.vicobaDesktop&&window.vicobaDesktop.savePdf){
    try{const r=await window.vicobaDesktop.savePdf(name+".pdf");if(r&&r.ok){kumb("PDF",r.path);save();toast("PDF imehifadhiwa: "+r.path)}else if(r&&r.error)toast("PDF haikuhifadhiwa: "+r.error)}
    catch(e){toast("PDF haikuhifadhiwa.")}return}
  const old=document.title;document.title=name;
  const done=()=>{document.title=old;window.removeEventListener("afterprint",done)};window.addEventListener("afterprint",done);
  toast('Kwenye dirisha la kuchapisha, chagua "Save as PDF" kisha Save.');
  setTimeout(()=>{window.print();setTimeout(done,60000)},250);
};

A.saveMember=el=>{
  const v=formVals($("#mwF")),old=el.dataset.id;
  const id=v.namba.replace(/\s+/g," ");
  if(!id)return toast("Ingiza namba ya mwanachama.");
  if(id.includes(" - "))return toast("Namba isiwe na ' - ' ndani yake.");
  const taken=D.wanachama.find(x=>x.id.toUpperCase()===id.toUpperCase()&&x.id!==old);
  if(taken)return toast("Namba "+id+" tayari ni ya "+fullName(taken)+".");
  if(!v.j1||!v.j2||!v.j3)return toast("Jaza majina yote matatu.");
  if(!v.simu)return toast("Jaza namba ya simu.");
  const dup=D.wanachama.find(x=>x.simu===v.simu&&x.id!==old);
  if(dup&&!confirm("Simu "+v.simu+" tayari imesajiliwa kwa "+dup.id+" ("+fullName(dup)+"). Endelea?"))return;
  if(old){
    const m=member(old);
    if(id!==old){
      if(!confirm("Badilisha namba "+old+" kuwa "+id+"? Miamala na mikopo yake yote itahamishiwa namba mpya."))return;
      for(const r of D.michango)if(r.mw===old)r.mw=id;
      for(const l of D.mikopo){if(l.mw===old)l.mw=id;if(l.mdhamini1===old)l.mdhamini1=id;if(l.mdhamini2===old)l.mdhamini2=id}
      for(const u of D.uongozi)if(u.mw===old)u.mw=id;
      kumb("Badilisha namba",old+" => "+id);
    }
    Object.assign(m,{id,j1:v.j1,j2:v.j2,j3:v.j3,simu:v.simu,anuani:v.anuani,tarehe:v.tarehe,hali:v.hali});save();closeDlg();render();return toast("Taarifa zimesasishwa.")}
  D.wanachama.push({id,j1:v.j1,j2:v.j2,j3:v.j3,simu:v.simu,anuani:v.anuani,tarehe:v.tarehe||todayISO(),hali:v.hali||"Hai"});
  D.wanachama.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  if(num(v.ada)>0)D.michango.push({id:uid(),risiti:nextReceipt(),tarehe:v.tarehe||todayISO(),mw:id,aina:"Ada ya Kujiunga",kiasi:num(v.ada),mkopo:"",maelezo:"Ada ya kujiunga"});
  save();closeDlg();render();toast("Mwanachama amesajiliwa: "+id);
};
A.delMember=el=>{
  const id=el.dataset.id,m=member(id);if(!m)return;
  const tx=D.michango.filter(r=>r.mw===id),lo=D.mikopo.filter(l=>l.mw===id),s=mStats(id);
  const ld=D.uongozi.filter(u=>u.mw===id),gu=D.mikopo.filter(l=>l.mdhamini1===id||l.mdhamini2===id);

function postPayment(mw,tarehe,amounts,mkopo,maelezo,lengo){
  const risiti=nextReceipt(),lines=[];
  for(const a of AINA){const k=num(amounts[a]);if(k>0){const row={id:uid(),risiti,tarehe,mw,aina:a,kiasi:k,mkopo:LOAN_TYPES.includes(a)?mkopo:"",maelezo};
    if(a==="Mchango Mwingine")row.lengo=(lengo||"").trim();D.michango.push(row);lines.push([a,k])}}

document.addEventListener("change",async e=>{if(e.target.id!=="xlsKikao")return;const f=e.target.files[0];e.target.value="";if(!f)return;
  try{let sheets;if(/\.csv$/i.test(f.name))sheets=XL.csv(await f.text());
    else{if(/\.xls$/i.test(f.name))throw new Error("Hifadhi faili kama .xlsx (Excel Workbook).");sheets=await XL.read(await f.arrayBuffer())}
    let sh=null,hi=-1,hdr=null;
    for(const x of sheets){const h=IM.headerRow(x.rows);if(h<0)continue;const n=x.rows[h].map(IM.norm);if(n.some(v=>IM.KEYS.namba.includes(v))&&n.some(v=>IM.ainaMap(v)||v==="hisa")){sh=x;hi=h;hdr=x.rows[h];break}}
    if(!sh)throw new Error("Haikupatikana karatasi yenye safu za Namba na michango. Tumia 'Pakua Excel ya kikao'.");
    const map={};hdr.forEach((h,ci)=>{const n=IM.norm(h);if(IM.KEYS.namba.includes(n)&&map.namba===undefined)map.namba=ci;
      else if(["amehudhuria","yupo","mahudhurio","hudhurio","alihudhuria"].includes(n))map.yupo=ci;
      else if(n.startsWith("lengo"))map.lengo=ci;else{const a=IM.ainaMap(n);if(a&&map[a]===undefined)map[a]=ci}});
    const errs=[];let filled=0,att=0;
    for(let r=hi+1;r<sh.rows.length;r++){const row=sh.rows[r]||[];if(row.every(v=>String(v??"").trim()===""))continue;
      const raw=IM.id(row[map.namba]);const m=resolveMember(raw);
      if(!m){errs.push("Mstari "+(r+1)+": namba "+raw+" haijasajiliwa");continue}
      const tr=document.querySelector(`#kTbl tr[data-mw="${CSS.escape(m.id)}"]`);if(!tr){errs.push("Mstari "+(r+1)+": "+m.id+" hayupo kwenye kikao (amejitoa?)");continue}
      let any=false;
      for(const a of AINA){if(map[a]===undefined)continue;const k=IM.amt(row[map[a]]);const inp=tr.querySelector(`input[data-c="${a}"]`);
        if(k<0){errs.push("Mstari "+(r+1)+": kiasi hasi ("+a+")");continue}
        if(k>0&&inp.disabled){errs.push("Mstari "+(r+1)+": "+m.id+" hana mkopo, "+a+" "+fm(k)+" imerukwa");continue}
        inp.value=k>0?k:"";if(k>0)any=true}
      const yv=map.yupo===undefined?"":IM.norm(row[map.yupo]);const yes=["ndiyo","ndio","ndyo","yes","y","1","true","x","yupo"].includes(yv);
      tr.querySelector(".yupo").checked=yes||any;if(yes||any)att++;
      const lg=map.lengo===undefined?"":String(row[map.lengo]??"").trim();tr.dataset.lengo=lg;tr.querySelector(".kl").textContent=lg?"Lengo: "+lg:"";
      if(any)filled++}
    kikaoTotals();
    dlg("Excel ya kikao imesomwa",`<div class="alert ok">Wanachama ${filled} wamejazwa michango; ${att} wamewekwa kuwa walihudhuria.</div>
      ${errs.length?`<div class="alert bad">Mistari ${errs.length} ina makosa na imerukwa:</div><ul>${errs.slice(0,40).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      <p>Kagua jedwali, kisha bonyeza <b>Hifadhi Kikao na Tengeneza Muhtasari</b>. Hakuna kilichohifadhiwa bado.</p>`);
  }catch(err){dlg("Faili halikusomeka",`<div class="alert bad">${esc(err.message||String(err))}</div>`)}});

  else if(t==="wanachama")rows=[["Namba","Jina la Kwanza","Jina la Kati","Jina la Mwisho","Simu","Anuani","Tarehe","Hali","Hisa","Jamii","Deni"],...D.wanachama.map(m=>{const s=mStats(m.id);return [m.id,m.j1,m.j2,m.j3,m.simu,m.anuani,m.tarehe,m.hali,s.hisa,s.jamii,s.deni]})];
  else if(t==="gawio"){const G=gawio();rows=[["Namba","Jina","Hisa","Jamii","Mawekezo","Sehemu %","Gawio","Mawekezo + Gawio","Deni","Kato la Deni","Deni Linalovuka","Malipo ya Mwisho"],...G.rows.map(r=>[r.m.id,fullName(r.m),r.hisa,r.jamii,r.msingi,(r.pct*100).toFixed(2),r.gawio,r.msingi+r.gawio,r.deni,r.kato,r.deniVuka,r.malipo])]}

function cyclePlan(){
  const G=gawio(),F=G.F,t=todayISO(),carried=[];
  const katoMap={};for(const r of G.rows)katoMap[r.m.id]=r.kato;
  for(const l of D.mikopo){const c=loanCalc(l);if(c.deni<=0)continue;
    let k=katoMap[l.mw]||0,ribaDue=Math.max(0,c.riba-c.paidR),prin=c.salio;
    const a=Math.min(k,ribaDue);ribaDue-=a;k-=a;const b=Math.min(k,prin);prin-=b;k-=b;katoMap[l.mw]=k;
    if(prin+ribaDue>0)carried.push({id:l.id,tarehe:t,mw:l.mw,kiasi:prin,riba:0,aina:"Flat",
      muda:Math.max(1,c.n-Math.min(c.n,monthsBetween(l.tarehe,t))),ribaYaZamani:ribaDue,vushwa:true,
      asili:(l.asili?l.asili+"; ":"")+"mkopo wa "+fd(l.tarehe)+" wa "+fm(c.P),mdhamini1:l.mdhamini1||"",mdhamini2:l.mdhamini2||""});}
  return {G,F,carried,salio:F.pesa-G.jumla};
}

A.doNewCycle=()=>{
  if(!confirm("Una uhakika? Kitendo hiki hakirudishwi (isipokuwa kwa kurejesha nakala)."))return;
  A.backup();
  const P=cyclePlan();if(P.salio<0)return toast("Pesa haitoshi kulipa malipo yote.");const salio=P.salio;
  D.historia.push({tarehe:todayISO(),anza:D.settings.anza,mwisho:D.settings.mwisho,faida:P.F.faida,kugawa:P.F.kugawa,salio,
    deniVuka:P.carried.reduce((a,c)=>a+c.kiasi+c.ribaYaZamani,0)});
  D.michango=[];D.mikopo=P.carried;D.mapato=[];D.matumizi=[];D.vikao=[];
  for(const p of D.miradi)if(num(p.mtaji)){p.maelezo=((p.maelezo||"")+" (Mtaji wa awali: "+fm(p.mtaji)+")").trim();p.mtaji=0}
  const t=todayISO();Object.assign(D.settings,{salioKuanzia:salio,mapatoMengineyo:0,anza:t,mwisho:addMonths(t,12),uchakavu:0,kiasiKilichoamuliwa:""});

const XL={};
XL.u8=s=>new TextEncoder().encode(s);
XL.crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
XL.crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=XL.crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
XL.zip=files=>{ // store-only zip writer
  const parts=[],cd=[];let off=0;
  for(const [name,data] of files){const nb=XL.u8(name),crc=XL.crc(data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+data.length}
  const cdSize=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
};
XL.x=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
XL.col=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};

XL.write=sheets=>{

  files.push(["_rels/.rels",XL.u8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)]);
  files.push(["xl/workbook.xml",XL.u8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${XL.x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`)]);
  files.push(["xl/_rels/workbook.xml.rels",XL.u8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)]);
  files.push(["xl/styles.xml",XL.u8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="13"/><color rgb="FF1F5C4A"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F5C4A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="6"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf numFmtId="3" applyNumberFormat="1"/><xf numFmtId="164" applyNumberFormat="1"/><xf fontId="2" applyFont="1"/><xf numFmtId="49" applyNumberFormat="1"/></cellXfs></styleSheet>`)]);
  sheets.forEach((s,i)=>{
    const rows=s.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{
      const ref=XL.col(ci)+(ri+1);if(v===""||v==null)return "";

      if(s.title&&ri===0)return `<c r="${ref}" t="inlineStr" s="4"><is><t>${XL.x(v)}</t></is></c>`;
      if(typeof v==="number"&&isFinite(v))return `<c r="${ref}" s="2"><v>${v}</v></c>`;
      if(v&&v.date){const d=parseISO(v.date),serial=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000);return `<c r="${ref}" s="3"><v>${serial}</v></c>`}
      return `<c r="${ref}" t="inlineStr"${s.textCols&&s.textCols.includes(ci)?' s="5"':""}><is><t xml:space="preserve">${XL.x(v)}</t></is></c>`}).join("")}</row>`).join("");
    const cols=s.widths?`<cols>${s.widths.map((w,ci)=>`<col min="${ci+1}" max="${ci+1}" width="${w}" customWidth="1"${s.textCols&&s.textCols.includes(ci)?' style="5"':""}/>`).join("")}</cols>`:"";
    const pane=s.header?`<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`:"";
    const lists=s.lists?Object.entries(s.lists).map(([ci,opt])=>`<dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="${XL.col(+ci)}2:${XL.col(+ci)}5000"><formula1>"${XL.x(opt.join(","))}"</formula1></dataValidation>`):[];
    const dv=lists.length?`<dataValidations count="${lists.length}">${lists.join("")}</dataValidations>`:"";
    files.push([`xl/worksheets/sheet${i+1}.xml`,XL.u8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rows}</sheetData>${dv}</worksheet>`)]);
  });
  return XL.zip(files);

/* ---------- reader */
XL.inflate=async data=>{const ds=new DecompressionStream("deflate-raw");return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer())};
XL.unzip=async buf=>{
  const dv=new DataView(buf),u=new Uint8Array(buf),out={};let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error("Faili hili si la Excel (.xlsx).");
  let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true),td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u.subarray(p+46,p+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    out[name]={method,data:u.subarray(ds,ds+cs)};p+=46+nl+el+cl;
  }
  return {get:async name=>{const f=out[name];if(!f)return null;const b=f.method===0?f.data:await XL.inflate(f.data);return new TextDecoder().decode(b)},names:Object.keys(out)};

A.xlExport=()=>{
  const ms=D.wanachama.map(m=>{const s=mStats(m.id);return [m.id,m.j1,m.j2,m.j3,m.simu,m.anuani,{date:m.tarehe},m.hali,s.hisa,s.jamii,s.deni]});
  const lo=D.mikopo.map(l=>{const c=loanCalc(l);return [l.id,l.mw,fullName(member(l.mw)||{}),{date:l.tarehe},c.P,num(l.riba),l.aina,num(l.muda),c.riba,c.rejesho,c.paidP,c.paidR,c.deni,c.malimbikizo,c.hali,guarantorText(l)]});

    {name:"Michango",header:true,widths:[11,12,9,24,20,14,12,11,26],rows:[["Risiti","Tarehe","Namba","Jina","Aina","Lengo","Kiasi","Mkopo","Maelezo"],...mi]},
    {name:"Mikopo",header:true,widths:[10,9,22,12,12,9,12,7,12,12,12,12,12,12,11,22],rows:[["Mkopo","Namba","Jina","Tarehe","Kiasi","Riba %","Aina","Miezi","Jumla Riba","Rejesho/Mwezi","Msingi Uliolipwa","Riba Iliyolipwa","Inayodaiwa","Malimbikizo","Hali","Wadhamini"],...lo]},

  ]);

function dlBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
